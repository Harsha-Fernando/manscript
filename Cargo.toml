[package]
name = "manscript"
version = "0.1.2"
edition = "2021"
description = "Language-agnostic development environment and project manager"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cli", "development", "environment", "python", "ruby"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/Harsha-Fernando/manscript"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
owo-colors = "4"
strsim = "0.11"
dirs = "6"
crossterm = "0.28"
semver = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
flate2 = "1"
tar = "0.4"
ureq = { version = "2", features = ["tls"] }
which = "7"
indicatif = "0.17"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[bin]]
name = "manscript"
path = "src/main.rs"
